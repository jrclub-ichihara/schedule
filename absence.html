<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jr.CLUB市原 お休み連絡</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style>:root{--y:#ffe600;--bg:#0b0b0b;--p:#171717;--l:#2c2c2c;--f:#fafafa;--m:#a3a3a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--f);font:15px/1.6 "Hiragino Sans","Noto Sans JP",sans-serif}.w{max-width:560px;margin:0 auto;padding:16px 16px 60px}h1{margin:4px 0 2px;font-size:22px}h1 small{display:block;font-size:12px;color:var(--y);letter-spacing:.1em}.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1;border:1.5px solid var(--y);background:transparent;color:var(--y);border-radius:12px;padding:10px;font-size:15px;font-weight:700}.tabs button.on{background:var(--y);color:#111}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}.card h2{margin:0 0 8px;font-size:15px}.card h2 i{font-style:normal;color:var(--y);margin-right:6px}select,input,textarea{width:100%;font-size:16px;font-family:inherit;padding:10px;border-radius:10px;border:1px solid var(--l);background:#0f0f0f;color:var(--f)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--l);background:#0f0f0f;color:var(--f);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;min-height:44px}.chips button small{display:block;font-size:11px;color:var(--m)}.chips button.on{background:var(--y);border-color:var(--y);color:#111}.chips button.on small{color:#333}.chips button.sun b{color:#ff8a8a}.chips button.sat b{color:#7cb6ff}.chips button.on b{color:#111}.rs button{flex:1 1 30%;text-align:center}.test{margin-top:10px;padding:10px;border:1px dashed #555;border-radius:10px}.test .r{display:flex;gap:6px;align-items:center}.test .r span{color:var(--m)}.test .r input{flex:1;min-width:0}.sub{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:900;background:var(--y);color:#111;margin-top:6px}.sub:disabled{opacity:.5}.ghost{border:1px solid var(--y);background:transparent;color:var(--y);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}.msg{margin:8px 0 0;font-size:13px;color:var(--m)}.msg.err{color:#ff9a9a}.msg.ok{color:#7dffb0}.day{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--l)}.day:last-child{border:0}.day .d{flex:none;width:72px;font-weight:700}.day .d.today{color:var(--y)}.day .n{display:flex;flex-wrap:wrap;gap:6px}.day .n span{background:#0f0f0f;border:1px solid var(--l);border-radius:8px;padding:2px 8px;font-size:14px}.day .n em{font-style:normal;font-size:11px;background:#7cb6ff;color:#111;border-radius:4px;padding:0 4px;margin-left:4px}.day .n button{border:0;background:transparent;color:#ff9a9a;font-size:12px;text-decoration:underline}.big{font-size:13px;color:var(--m)}.big b{font-size:28px;color:var(--y);margin-right:4px}</style>
<link rel="stylesheet" href="common.css">
<style>body{background:var(--ink)!important}
.w{padding-top:8px!important}
.card{background:linear-gradient(160deg,#1c1c19,#121210)!important;border:1px solid var(--line)!important;border-radius:14px!important}
.tabs button{border:1px solid var(--line)!important;background:linear-gradient(160deg,#1c1c19,#121210)!important;color:#bdbbb4!important;border-radius:12px!important;font-weight:800;transition:transform .25s var(--ease)}
.tabs button.on{border-color:var(--y)!important;color:#fff!important;box-shadow:0 0 0 3px rgba(255,235,59,.1);background:linear-gradient(160deg,#25230f,#121210)!important}
.tabs button:active,.chips button:active{transform:scale(.97)}
.chips button{border-radius:12px!important;transition:transform .25s var(--ease)}
</style>
</head>
<body>
<header class="hero"><div class="big">ABSENCE</div><div class="rush"></div><div class="in">
  <img src="logo.jpg" alt="ICHIHARA">
  <div><h1 data-split>ABSENCE</h1><p>お休み連絡・今日だれが休み？</p><div class="tg">POUNDING THE ROCK</div></div>
</div></header>
<div style="max-width:720px;margin:0 auto;padding:12px 16px 0"><div class="topnav" style="margin:0"><a class="tile back" href="./">‹ <b>SCHEDULE</b><small>予定表にもどる</small></a></div></div>
<script src="common.js"></script>
<script>JR.shim();</script>
<div class="w"><div id="lock" class="card" hidden><h2>チーム用パスコード</h2><input id="pw" type="password" inputmode="numeric" placeholder="パスコード"><button class="sub" id="pwgo">ひらく</button><p class="msg" id="pwm"></p></div><div id="main"><div class="tabs"><button data-t="send" class="on">お休みを送る</button><button data-t="list">今日だれが休み？</button></div><div id="send"> <div class="card"><h2><i>1</i>選手の名前</h2><select id="nm"><option value="">えらんでください</option></select></div> <div class="card"><h2><i>2</i>お休みする日（いくつでも）</h2><div class="chips" id="days">読み込み中…</div>  <div class="test"><b style="font-size:13px">テスト期間をまとめて入れる</b><div class="r"><input type="date" id="tf"><span>〜</span><input type="date" id="tt"></div><button class="ghost" id="tset">この間の日を全部えらぶ</button></div></div> <div class="card"><h2><i>3</i>理由</h2><div class="chips rs" id="rs"></div><textarea id="memo" rows="2" placeholder="ひとこと（なくてOK）" style="margin-top:8px"></textarea></div> <button class="sub" id="go">お休みを送る</button><p class="msg" id="m1"></p></div><div id="list" hidden><div class="card"><div class="big" id="tdy"></div></div><div class="card" id="ls">読み込み中…</div></div></div></div><script>var D=null,SEL={},RS="",MY={},PW="";try{PW=localStorage.getItem("oy_pw")||""}catch(e){}var W="日月火水木金土";try{MY=JSON.parse(localStorage.getItem("oy_my")||"{}")}catch(e){}function $(i){return document.getElementById(i)}function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}function dw(k){var p=k.split("/");return new Date(+p[0],+p[1]-1,+p[2]).getDay()}function lab(k){var p=k.split("/");return (+p[1])+"/"+(+p[2])+"("+W[dw(k)]+")"}function msg(t,c){var m=$("m1");m.textContent=t;m.className="msg "+(c||"")}function draw(){var o="";D.days.forEach(function(d){var w=dw(d.key);o+="<button data-k=\""+d.key+"\" class=\""+(SEL[d.key]?"on ":"")+(w==0?"sun":w==6?"sat":"")+"\"><b>"+lab(d.key)+"</b><small>"+esc(d.items.map(function(i){return i.label}).join(" / "))+"</small></button>"});$("days").innerHTML=o||"この先の予定がまだありません"; $("rs").innerHTML=D.reasons.map(function(r){return "<button data-r=\""+r+"\" class=\""+(r==RS?"on":"")+"\">"+r+"</button>"}).join("")}function drawList(){var by={};D.list.forEach(function(x){(by[x.date]=by[x.date]||[]).push(x)});var t=by[D.today]||[]; $("tdy").innerHTML="今日 "+lab(D.today)+" のお休み<br><b>"+t.length+"人</b>"+esc(t.map(function(x){return x.name}).join("、")); var ks=Object.keys(by).sort();$("ls").innerHTML=ks.length?ks.map(function(k){return "<div class=\"day\"><div class=\"d"+(k==D.today?" today":"")+"\">"+lab(k)+"</div><div class=\"n\">"+by[k].map(function(x){return "<span>"+esc(x.name)+(x.test?"<em>テスト</em>":"")+(MY[x.id]?" <button data-c=\""+x.id+"\">取り消す</button>":"")+"</span>"}).join("")+"</div></div>"}).join(""):"この先のお休み連絡はありません"}document.querySelector(".tabs").onclick=function(e){var b=e.target.closest("[data-t]");if(!b)return;[].forEach.call(document.querySelectorAll(".tabs button"),function(x){x.classList.toggle("on",x==b)});$("send").hidden=b.dataset.t=="list";$("list").hidden=b.dataset.t!="list"};$("days").onclick=function(e){var b=e.target.closest("[data-k]");if(!b)return;SEL[b.dataset.k]=!SEL[b.dataset.k];b.classList.toggle("on")};$("rs").onclick=function(e){var b=e.target.closest("[data-r]");if(!b)return;RS=b.dataset.r;draw()};$("tset").onclick=function(){var f=$("tf").value.replace(/-/g,"/"),t=$("tt").value.replace(/-/g,"/");if(!f||!t){msg("テストの最初と最後の日を入れてください","err");return}if(t<f){var x=f;f=t;t=x}var n=0;D.days.forEach(function(d){if(d.key>=f&&d.key<=t){SEL[d.key]=true;n++}});RS="テスト";draw();msg(n?n+"日をえらびました（理由はテストにしました）":"その間に練習・試合の予定がありません",n?"ok":"err")};$("nm").onchange=function(){try{localStorage.setItem("oy_nm",this.value)}catch(e){}};$("go").onclick=function(){var ds=Object.keys(SEL).filter(function(k){return SEL[k]});var nm=$("nm").value; if(!nm){msg("選手の名前をえらんでください","err");return}if(!ds.length){msg("お休みする日をえらんでください","err");return}if(!RS){msg("理由をえらんでください","err");return} var b=this;b.disabled=true;b.textContent="送信中…";msg(""); google.script.run.withSuccessHandler(function(r){r.ids.forEach(function(i){MY[i]=1});try{localStorage.setItem("oy_my",JSON.stringify(MY))}catch(e){}D.list=r.list;SEL={};RS="";$("memo").value="";draw();drawList();b.disabled=false;b.textContent="お休みを送る";msg(nm+" "+ds.length+"日分のお休みを受け付けました。ありがとうございます！","ok")}) .withFailureHandler(function(e){b.disabled=false;b.textContent="お休みを送る";msg("送れませんでした："+(e&&e.message||e),"err")}).oySubmit({pass:PW,name:nm,dates:ds,reason:RS,memo:$("memo").value})};$("ls").onclick=function(e){var b=e.target.closest("[data-c]");if(!b||!confirm("このお休みを取り消しますか？"))return;b.disabled=true;google.script.run.withSuccessHandler(function(r){D.list=r.list;drawList()}).withFailureHandler(function(){alert("取り消せませんでした")}).oyCancel(PW,[b.dataset.c])};function load(){google.script.run.withSuccessHandler(function(d){if(d.needPass){$("lock").hidden=false;$("main").hidden=true;if(PW){$("pwm").textContent="パスコードが違います";$("pwm").className="msg err"}return}$("lock").hidden=true;$("main").hidden=false;try{localStorage.setItem("oy_pw",PW)}catch(e){}D=d;var s=$("nm");s.length=1;d.players.forEach(function(p){var o=document.createElement("option");o.value=p.name;o.textContent="#"+p.no+" "+p.name;s.appendChild(o)});try{var v=localStorage.getItem("oy_nm");if(v)s.value=v}catch(e){}draw();drawList()}).withFailureHandler(function(e){$("days").textContent="読み込めませんでした："+(e&&e.message||e)}).oyInit(PW)}$("pwgo").onclick=function(){PW=$("pw").value.trim();$("pwm").textContent="確認中…";$("pwm").className="msg";load()};load();</script>
<script>
/* 表示後のふわっと */
(function(){var v=document.getElementById('view')||document.querySelector('.w')||document.querySelector('main');if(!v)return;new MutationObserver(function(){JR.reveal(v,'.alb,.chips button,.ph div,.addAlb,.card')}).observe(v,{childList:true,subtree:true})})();
</script>
</body>
</html>
