<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16204a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="送迎ドリル">
<title>送迎ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#16204a;--bg2:#1f2c5f;--card:#243369;--ink:#fff;--sub:#b9c3e6;--or:#ff7a1a;--or2:#ffb14a;--ok:#35d07f;--ng:#ff5a6a;--line:#3a4a86;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + var(--st)) 16px calc(30px + var(--sb))}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px;letter-spacing:.04em}.logo span{color:var(--or)}
.sm{background:var(--bg2);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:6px 11px;font-weight:800}
.hello{color:var(--sub);font-size:13px;margin:8px 0 0}
.hero{margin:12px 0 14px;padding:16px 18px;border-radius:22px;background:linear-gradient(135deg,var(--or),var(--or2));color:#2a1300;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:16px solid rgba(255,255,255,.25)}
.heroT{font-weight:900;font-size:clamp(34px,10vw,46px);line-height:1.05}
.heroS{font-weight:800;font-size:13px;margin-top:4px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.card.main{border-color:var(--or);background:linear-gradient(90deg,#3a2f5a,var(--card) 70%)}
.ic{font-size:30px;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.card h3{margin:0;font-size:18px;font-weight:900}.card p{margin:2px 0 0;font-size:12px;color:var(--sub)}
.st{margin-left:auto;flex:none;font-size:12px;font-weight:900;color:var(--sub);text-align:right}
.st.done{background:var(--ok);color:#06301a;border-radius:999px;padding:4px 10px}
.sec{margin:18px 0 6px;font-weight:900;font-size:14px;display:flex;align-items:baseline;gap:8px}.sec small{font-weight:500;color:var(--sub);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:13px;line-height:1.3}
.chip small{display:block;font-weight:500;color:var(--sub);font-size:11px}
.chip.on{border-color:var(--or);background:#3a2b2a}
.chip.off{opacity:.45}
.week{display:flex;gap:5px}
.week div{flex:1;text-align:center;background:var(--bg2);border-radius:12px;padding:5px 0 7px;font-size:11px;color:var(--sub)}
.week b{display:block;font-size:17px;height:22px;line-height:22px}
.week .today{outline:2px solid var(--or);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--bg2);border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--or2)}.stats span{font-size:11px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px;font-size:16px;font-weight:900;background:var(--or);color:#2a1300;box-shadow:0 4px 0 #b44f00;margin-top:10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b44f00}
.btn.sub{background:var(--bg2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3);border:2px solid var(--line)}
.note{font-size:11px;color:var(--sub);line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links button{flex:1;min-width:46%;background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;font-size:12px;font-weight:800;color:var(--sub)}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,25,.7);display:flex;align-items:flex-end;justify-content:center}
.mbox{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:16px 16px calc(24px + var(--sb));border-top:3px solid var(--or)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mhead h2{margin:0;font-size:18px;font-weight:900}
.x{background:var(--bg2);border:0;border-radius:50%;width:36px;height:36px;font-size:16px;font-weight:900}
.bar{display:flex;gap:4px}.bar i{flex:1;height:7px;border-radius:4px;background:var(--line)}.bar .ok{background:var(--ok)}.bar .ng{background:var(--ng)}.bar .cur{background:var(--or)}
.q{font-size:clamp(38px,12vw,56px);font-weight:900;text-align:center;margin:18px 0 6px;word-break:break-word}
.q.ja{font-size:clamp(26px,8vw,36px)}
.q.long{font-size:19px;line-height:1.6;text-align:left;background:var(--card);border-radius:16px;padding:14px}
.qs{text-align:center;color:var(--sub);font-size:13px}
.ch{display:block;width:100%;margin:9px 0;padding:15px 12px;border-radius:16px;font-size:18px;font-weight:900;background:var(--card);border:2px solid var(--line)}
.ch.ok{border-color:var(--ok);background:#173d33}.ch.ng{border-color:var(--ng);background:#46202d}
.box{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0}
.box.ng{border-left:5px solid var(--ng)}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:800}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;background:var(--bg2);color:#fff;border:2px solid var(--line);border-radius:12px;padding:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stars button{background:none;border:0;font-size:32px;color:var(--line);padding:0 2px}.stars button.on{color:var(--or2)}
.mono{white-space:pre-wrap;word-break:break-all;background:#0e1534;border:1px dashed var(--line);border-radius:12px;padding:10px;font:13px/1.6 ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--or2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--bg2);border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;font-weight:800}
.badge b{display:block;font-size:28px}.badge.lock{opacity:.3;filter:grayscale(1)}
/* listen */
#listen{position:fixed;inset:0;z-index:30;background:#05081a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#lsW{font-size:clamp(44px,13vw,80px);font-weight:900;color:var(--or2);min-height:1.3em}
#lsJ{font-size:clamp(24px,7vw,36px);font-weight:900;min-height:1.5em}
#lsI{color:var(--sub);font-size:13px;margin-top:16px}
#lsC{display:flex;gap:10px;margin-top:26px;width:min(340px,100%)}
#lsC .btn{margin:0}
/* gate */
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .in{width:min(360px,100%);text-align:center}
#toasts{position:fixed;left:50%;top:calc(18px + var(--st));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#fff;color:#16204a;font-weight:900;border-radius:999px;padding:8px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:t 2.6s ease forwards;white-space:nowrap}
@keyframes t{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}

#w3{position:fixed;inset:0;z-index:15;background:#8fd3ff}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.w3top{position:absolute;left:calc(10px);top:calc(10px + var(--st));right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.w3top>*{pointer-events:auto}
.w3coin{background:rgba(22,32,74,.85);border:2px solid var(--or2);border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px}
#joy{position:absolute;left:22px;bottom:calc(22px + var(--sb));width:124px;height:124px;border-radius:50%;background:rgba(22,32,74,.35);border:3px solid rgba(255,255,255,.7);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--or);border:3px solid #fff}
#bJump{position:absolute;right:22px;bottom:calc(26px + var(--sb));width:84px;height:84px;border-radius:50%;background:var(--or);border:4px solid #fff;font-weight:900;font-size:15px;color:#2a1300;touch-action:none}
#bAct{position:absolute;right:118px;bottom:calc(40px + var(--sb));min-width:90px;height:58px;padding:0 14px;border-radius:29px;background:#fff;color:#16204a;border:3px solid var(--or);font-weight:900;font-size:15px;touch-action:none}
#bAct small{display:block;font-size:10px;font-weight:800;color:#5a6aa8;line-height:1}
.w3hint{position:absolute;left:50%;bottom:calc(10px + var(--sb));transform:translateX(-50%);font-size:11px;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;white-space:nowrap}
body.touch .w3hint{display:none}
body:not(.touch) #joy,body:not(.touch) #bJump{display:none}
body:not(.touch) #bAct{right:22px}
#modal{z-index:25}
</style>
</head>
<body>
<div id="gate" class="hidden"><div class="in">
 <div class="logo" style="font-size:30px">送迎<span>ドリル</span></div>
 <p class="note" style="font-size:13px">部活・習いごとで忙しい子へ。<br>送迎の車の中・待ち時間の5分で、1セット。<br>小1〜高校・5教科</p>
 <label class="f" style="text-align:left">パスワード（記事に書いてあります）</label>
 <input type="password" id="pw" autocomplete="off" placeholder="パスワード">
 <button class="btn" id="pwGo">はじめる</button>
 <p class="note" id="pwMsg" style="margin-top:10px"></p>
</div></div>

<div class="wrap" id="home"></div>

<div id="modal" class="hidden"><div class="mbox"><div class="mhead"><h2 id="mT"></h2><button class="x" id="mX">✕</button></div><div id="mB"></div></div></div>

<div id="listen" class="hidden"><p class="note" style="font-size:13px;margin-bottom:18px">🎧 画面は見なくてOK。音を聞いて、頭の中で答えよう</p>
 <div id="lsW"></div><div id="lsJ"></div><div id="lsI"></div>
 <div id="lsC"><button class="btn sub" id="lsP">⏸ 一時停止</button><button class="btn" id="lsS">■ おわる</button></div></div>
<div id="w3" class="hidden"><canvas id="gl"></canvas>
 <div class="w3top"><button class="sm" id="bExit">🏠 もどる</button><div class="w3coin">🪙 <span id="w3coin">0</span></div></div>
 <div id="joy"><div id="knob"></div></div><button id="bJump">JUMP</button><button id="bAct" class="hidden"></button>
 <div class="w3hint">WASD・矢印：移動　ドラッグ：カメラ　Space：ジャンプ　E：話す</div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ====== 設定 ====== */
const PW_HASH='';
const STORE='sougei_drill_v1';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
function weekStart(){const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),2700)}

/* ====== データ（この端末の中だけに保存） ====== */
let D;
function blank(){return{v:1,unlocked:false,name:'',act:'',settings:{sound:true,grade:'中1',subj:'en'},vocab:{},hist:[],practice:[],badges:{},lastBackup:null,created:today()}}
function load(){try{D=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){D=null}if(!D||D.v!==1)D=blank();D.settings=Object.assign({sound:true,grade:'中1',subj:'en'},D.settings);if(D.settings.set){D.settings.grade=D.settings.set==='B'?'中2':'中1';delete D.settings.set}if(!GRADES.includes(D.settings.grade))D.settings.grade='中1';if(!avail(D.settings.subj,D.settings.grade))D.settings.subj='ma'}
function save(){try{localStorage.setItem(STORE,JSON.stringify(D))}catch(e){}}

/* ====== 学年・教科 ====== */
const GRADES=['小1','小2','小3','小4','小5','小6','中1','中2','中3','高校'];
const SUBJ={en:{n:'英語',ic:'🔤'},ja:{n:'国語',ic:'✏️'},ma:{n:'算数・数学',ic:'➗'},sc:{n:'理科',ic:'🔬'},so:{n:'社会',ic:'🗾'}};
const gi=g=>GRADES.indexOf(g);
const band=g=>{const i=gi(g);return i<=1?'e12':i<=3?'e34':i<=5?'e56':i<=8?'jh':'hs'};
const BAND_N={e34:'小3・4',e56:'小5・6',jh:'中学',hs:'高校'};
const avail=(s,g)=>!((s==='sc'||s==='so')&&band(g)==='e12');
const subjName=(s,g)=>s==='ma'?(gi(g)<=5?'算数':'数学'):SUBJ[s].n;
function enKey(g){const i=gi(g);return i<=5?'E':g==='中1'?'A':g==='中2'?'B':g==='中3'?'C':'H'}
function kanjiKey(g){const i=gi(g);return i<=5?g:i<=8?'中学':'高校'}
function topic(s,g){if(s==='en')return EN[enKey(g)].name;if(s==='ja')return`漢字の読み（${kanjiKey(g)}）`;if(s==='ma')return`計算（${g}）`;return`${SUBJ[s].n}（${BAND_N[band(g)]}）`}

/* ====== 英単語 ====== */
const EN={
 E:{name:'英単語（小学生）',w:[['dog','犬'],['cat','ねこ'],['bird','鳥'],['fish','魚'],['apple','りんご'],['milk','牛乳'],['water','水'],['book','本'],['desk','つくえ'],['sun','太陽'],
  ['red','赤'],['blue','青'],['big','大きい'],['small','小さい'],['happy','うれしい'],['run','走る'],['swim','泳ぐ'],['eat','食べる'],['Monday','月曜日'],['Sunday','日曜日']]},
 A:{name:'英単語（中1レベル）',w:[['school','学校'],['friend','友だち'],['family','家族'],['morning','朝'],['evening','夕方'],['week','週'],['weekend','週末'],['library','図書館'],['hospital','病院'],['station','駅'],
  ['favorite','お気に入りの'],['practice','練習する'],['study','勉強する'],['teach','教える'],['learn','学ぶ'],['begin','始める'],['cold','寒い・冷たい'],['hungry','おなかがすいた'],['tired','つかれた'],['busy','いそがしい'],
  ['often','よく・しばしば'],['usually','ふつうは・たいてい'],['sometimes','ときどき'],['always','いつも'],['early','早く・早い'],['tomorrow','明日'],['yesterday','昨日'],['country','国'],['language','言語・ことば'],['winter','冬']]},
 B:{name:'英単語（中2レベル）',w:[['decide','決める'],['remember','覚えている・思い出す'],['forget','忘れる'],['borrow','借りる'],['lend','貸す'],['arrive','到着する'],['believe','信じる'],['change','変える・変わる'],['grow','育つ・育てる'],['invite','招待する'],
  ['visit','訪れる'],['understand','理解する'],['important','大切な'],['popular','人気のある'],['dangerous','危険な'],['difficult','難しい'],['easy','簡単な'],['useful','役に立つ'],['interesting','おもしろい・興味深い'],['famous','有名な'],
  ['future','未来・将来'],['history','歴史'],['culture','文化'],['experience','経験'],['information','情報'],['example','例'],['problem','問題'],['museum','博物館・美術館'],['dream','夢'],['team','チーム']]},
 C:{name:'英単語（中3レベル）',w:[['although','〜だけれども'],['during','〜の間（ずっと）'],['among','（3つ以上）の間で'],['environment','環境'],['society','社会'],['government','政府'],['opinion','意見'],['communicate','意思を伝え合う'],['discover','発見する'],['increase','増える・増やす'],
  ['decrease','減る・減らす'],['protect','守る'],['receive','受け取る'],['explain','説明する'],['solve','解決する'],['develop','発達させる・開発する'],['peace','平和'],['war','戦争'],['foreign','外国の'],['either','（2つのうち）どちらか']]},
 H:{name:'英単語（高校基礎）',w:[['achieve','達成する'],['require','必要とする'],['maintain','維持する'],['consider','よく考える'],['reduce','減らす'],['provide','提供する'],['affect','影響を与える'],['recognize','認める・それとわかる'],['efficient','効率的な'],['significant','重要な・かなりの'],
  ['essential','不可欠な'],['previous','以前の'],['approximately','およそ'],['consequence','結果'],['evidence','証拠'],['opportunity','機会'],['resource','資源'],['attitude','態度'],['obtain','得る'],['contribute','貢献する']]}};

/* ====== 漢字の読み [ことば, 正しい読み, まちがい3つ] ====== */
const KANJI={
 '小1':[['花火','はなび',['かび','はなひ','かか']],['青空','あおぞら',['あおくう','あおそら','せいぞら']],['大雨','おおあめ',['おおう','だいあめ','おおあま']],['森林','しんりん',['もりりん','しんばやし','しんもり']],
  ['入学','にゅうがく',['いりがく','にゅうまな','はいりがく']],['先生','せんせい',['さきせい','せんしょう','さきうまれ']],['天気','てんき',['てんけ','あまき','てんぎ']],['足音','あしおと',['そくおん','あしね','たりおと']],
  ['小石','こいし',['しょうせき','こせき','おいし']],['王子','おうじ',['おうこ','きみこ','おうし']],['十円','じゅうえん',['とうえん','じゅえん','じゅうまる']],['手足','てあし',['てそく','しゅあし','てたり']]],
 '小2':[['公園','こうえん',['こうその','おおやけえん','こえん']],['汽車','きしゃ',['きぐるま','きじゃ','きくるま']],['晴天','せいてん',['はれてん','せいあま','はれぞら']],['遠足','えんそく',['とおあし','えんあし','とおそく']],
  ['新聞','しんぶん',['あたらきく','しんもん','にいぶん']],['電話','でんわ',['でんはなし','てんわ','でんご']],['親友','しんゆう',['おやとも','しんとも','おやゆう']],['牛肉','ぎゅうにく',['うしにく','ぎゅうじく','ごにく']],
  ['昼食','ちゅうしょく',['ひるしょく','ちゅうじき','ひるたべ']],['歌声','うたごえ',['かせい','うたこえ','かごえ']],['毎週','まいしゅう',['まいしゅ','ごとしゅう','まいじゅう']],['朝日','あさひ',['ちょうにち','あさび','あさにち']]],
 '小3':[['水泳','すいえい',['みずおよぎ','すいおう','すいえ']],['鉄橋','てっきょう',['てつばし','てっぱし','てつきょう']],['宿題','しゅくだい',['やどだい','しゅくてい','しゅくたい']],['温度','おんど',['あたたかど','おんたび','おんと']],

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const M='−';
const sn=n=>n<0?M+(-n):String(n);
const pn=n=>n<0?`(${M}${-n})`:String(n);
function fr(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;return d===1?sn(n):`${n<0?M:''}${Math.abs(n)}/${d}`}
const ten=n=>n%10===0?String(n/10):(n/10).toFixed(1);
function near(ans,k=3,spread=5,allowNeg=false){const s=new Set([ans]);let t=0;while(s.size<k+1&&t++<200){let v=ans+ri(-spread,spread);if(!allowNeg&&v<0)continue;s.add(v)}s.delete(ans);return[...s].slice(0,k)}
function uniq(ans,ws){const out=[];for(const w of ws)if(w!==ans&&!out.includes(w))out.push(w);return out.slice(0,3)}
function exprLin(a,b,v='x'){const t1=a===1?v:a===-1?M+v:sn(a)+v;if(b===0)return t1;return t1+(b>0?' ＋ ':' '+M+' ')+Math.abs(b)}
function quadStr(p,q){let s='x²';if(p)s+=(p>0?' ＋ ':' '+M+' ')+(Math.abs(p)===1?'':Math.abs(p))+'x';if(q)s+=(q>0?' ＋ ':' '+M+' ')+Math.abs(q);return s}

function bankFor(s,g){if(s==='en'){const k=enKey(g);return EN[k].w.map(([en,ja])=>({id:en,en,ja}))}
 if(s==='ja')return KANJI[kanjiKey(g)].map(([w,r,ws])=>({id:'ja:'+w,q:w,a:r,ws,sub:'この漢字の読みは？',e:`${w}（${r}）`}));
 const B=(s==='sc'?SCI:SOC)[band(g)];return B.map(([q,a,ws,e])=>({id:s+':'+q,q,a,ws,e,long:true}))}
function buildQuiz(s,g,n){if(s==='ma'){const out=[],seen=new Set();let t=0;while(out.length<n&&t++<200){const x=mathQ(g);if(seen.has(x.q))continue;seen.add(x.q);if(x.ws.length===3)out.push(x)}return out}
 const V=D.vocab,sc=it=>{const v=V[it.id];return v?(v.ng*2-v.ok)+Math.random()*1.5:1+Math.random()};
 const pool=bankFor(s,g).sort((a,b)=>sc(b)-sc(a)).slice(0,n).sort(()=>Math.random()-.5);
 if(s==='en'){const all=bankFor(s,g);return pool.map((w,i)=>{const toJa=i%2===0;const others=all.filter(o=>o.id!==w.id).sort(()=>Math.random()-.5).slice(0,3);
   return{id:w.id,q:toJa?w.en:w.ja,a:toJa?w.ja:w.en,ws:others.map(o=>toJa?o.ja:o.en),sub:toJa?'この英単語の意味は？':'この意味の英単語は？',e:`${w.en} ＝ ${w.ja}`,speak:w.en,speakNow:toJa,ja:!toJa}})}
 return pool}

const TTS=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
function voice(l){try{return speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(l))}catch(e){return null}}
function say(text,lang,rate=1){return new Promise(res=>{if(!TTS||!D.settings.sound){setTimeout(res,lang==='en'?900:1100);return}let done=false;const fin=()=>{if(!done){done=true;res()}};
 try{const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-US':'ja-JP';const v=voice(lang);if(v)u.voice=v;u.rate=rate;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}setTimeout(fin,2500+text.length*250)})}
const hush=()=>{try{TTS&&speechSynthesis.cancel()}catch(e){}};

function quiz(){const sj=D.settings.subj,gr=D.settings.grade;const qs=buildQuiz(sj,gr,QN);const N=qs.length;let i=0,ok=0;const res=[];
 const show=()=>{const it=qs[i];const ch=[it.a,...it.ws].sort(()=>Math.random()-.5);const cls=(it.long||it.q.length>14)?' long':(it.ja||(sj==='ma'&&it.q.length>8))?' ja':'';
  modal(`${subjName(sj,gr)} ${i+1}/${N}`,`<div class="bar">${qs.map((_,k)=>`<i class="${k<i?(res[k].c?'ok':'ng'):k===i?'cur':''}"></i>`).join('')}</div>
   <div class="qs" style="margin-top:14px">${esc(it.sub||(sj==='ma'?'答えはどれ？':'正しいものはどれ？'))}</div><div class="q${cls}">${esc(it.q)}</div>
   ${it.speak&&it.speakNow?'<div class="qs"><button class="sm" id="spk">🔊 もう一度きく</button></div>':''}
   <div id="cs">${ch.map((c,k)=>`<button class="ch" data-k="${k}">${esc(c)}</button>`).join('')}</div><div id="nx"></div>`,el=>{
   if(it.speak&&it.speakNow){say(it.speak,'en',.9);el.querySelector('#spk').onclick=()=>{hush();say(it.speak,'en',.85)}}
   el.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const cs=el.querySelector('#cs');if(cs.dataset.d)return;cs.dataset.d=1;const good=ch[+b.dataset.k]===it.a;if(good)ok++;res.push({q:it.q,a:it.a,e:it.e,c:good});
    if(it.id){const V=D.vocab;V[it.id]=V[it.id]||{ok:0,ng:0};good?V[it.id].ok++:V[it.id].ng++}
    el.querySelectorAll('.ch').forEach(x=>{if(ch[+x.dataset.k]===it.a)x.classList.add('ok');else if(x===b)x.classList.add('ng')});hush();if(it.speak&&!it.speakNow)say(it.speak,'en',.9);
    const nx=el.querySelector('#nx');nx.innerHTML=`<div class="qs" style="margin:8px 0">${good?'⭕ 正解！':'❌ おしい！'}</div>${it.e?`<div class="box" style="font-size:13px">${esc(it.e)}</div>`:''}`;
    const go=()=>{if(res.length!==i+1)return;i++;i<N?show():finish()};nx.appendChild(btn(i<N-1?'次へ ▶':'結果を見る',go));if(good&&!it.long&&sj!=='ma')setTimeout(()=>{if(!$('#modal').classList.contains('hidden'))go()},1300)})})};
 const finish=()=>{D.hist.push({date:today(),ts:Date.now(),type:'quiz',subj:sj,grade:gr,score:ok,total:N});save();checkBadges();
  const miss=res.filter(r=>!r.c),both=pracDays().has(today());
  modal('結果',`<div class="q">${ok}<span style="font-size:.45em;color:var(--sub)"> / ${N}</span></div><div class="qs">${ok===N?'全問正解！すごい！':ok>=7?'いい感じ！':'まちがえた問題は、次に多めに出るよ'}</div>
   ${miss.length?`<div class="sec">まちがえた問題</div>${miss.map(r=>`<div class="box ng"><b>${esc(r.q)}</b><br>答え：${esc(r.a)}${r.e&&sj!=='en'?`<div class="note">${esc(r.e)}</div>`:''}</div>`).join('')}`:''}
   ${both?'<div class="box">⭐ 今日は練習もやったから「文武両道デー」！</div>':`<div class="box">${actIc()} 今日、練習も記録すると「文武両道デー」になるよ</div>`}`,el=>el.appendChild(btn('ホームへ',closeModal)))};
 show()}

function listen(){const ws=EN[enKey(D.settings.grade)].w.slice().sort((x,y)=>{const V=D.vocab,f=w=>{const v=V[w[0]];return v?(v.ng*2-v.ok)+Math.random()*1.5:1+Math.random()};return f(y)-f(x)}).slice(0,LN).sort(()=>Math.random()-.5);const S=LS={i:0,p:false,stop:false,heard:0};$('#listen').classList.remove('hidden');$('#lsP').textContent='⏸ 一時停止';$('#lsW').textContent='';$('#lsJ').textContent='';
 $('#lsI').textContent=!TTS?'この端末では読み上げが使えないため、文字だけで進みます':!D.settings.sound?'🔇 音なし設定です（ホーム右上で切りかえ）':'';
 const gate=async()=>{while(S.p&&!S.stop)await wait(200)};
 (async()=>{await say(' ','ja');for(;S.i<ws.length&&!S.stop;S.i++){const[en,ja]=ws[S.i];await gate();if(S.stop)break;$('#lsW').textContent=en;$('#lsJ').textContent='';$('#lsI').textContent=`${S.i+1} / ${ws.length}`;
  await say(en,'en',.85);await wait(1800);await gate();if(S.stop)break;$('#lsJ').textContent=ja;await say(ja,'ja');await wait(500);await say(en,'en',.85);await wait(900);S.heard=S.i+1}endListen(S)})()}
function endListen(S){if(S.end)return;S.end=S.stop=true;hush();$('#listen').classList.add('hidden');
 if(S.heard>=5){D.hist.push({date:today(),ts:Date.now(),type:'listen',grade:D.settings.grade,count:S.heard});save();checkBadges();toast(`🎧 ${S.heard}語 聞いた！おつかれさま`)}else toast('5語以上聞くと記録されるよ');renderHome()}
$('#lsS').onclick=()=>LS&&endListen(LS);
$('#lsP').onclick=()=>{if(!LS)return;LS.p=!LS.p;if(LS.p)hush();$('#lsP').textContent=LS.p?'▶ 再開':'⏸ 一時停止'};

/* ====== バックアップ ====== */
function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(c=>s+=String.fromCharCode(c));return'SGD1-'+btoa(s)}
function dec(code){const s=atob(code.trim().replace(/^SGD1-/,'').replace(/\s/g,''));const b=Uint8Array.from(s,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))}
function backup(){const data=Object.assign({},D,{unlocked:true});const code=enc(data);
 modal('バックアップ',`<p class="note">機種変更やブラウザのデータ削除で、記録が消えることがあります。下のコードをLINEのメモなどに貼っておけば、新しい端末で元に戻せます。</p>
  <div class="sec">① コードを保存する</div><div class="mono" id="bc" style="max-height:120px;overflow:auto">${code}</div>
  <div id="b1"></div>
  <div class="sec">② 新しい端末で元に戻す</div><textarea id="bi" rows="3" placeholder="SGD1- から始まるコードを貼りつけ"></textarea><div id="b2"></div>
  <p class="note">※元に戻すと、この端末の今の記録はコードの内容に置きかわります。</p>`,el=>{
  el.querySelector('#b1').appendChild(btn('📋 コードをコピー',()=>{copy(code,el.querySelector('#bc'));D.lastBackup=new Date().toISOString();save()}));
  el.querySelector('#b2').appendChild(btn('このコードで元に戻す',()=>{try{const o=dec(el.querySelector('#bi').value);if(o.v!==1)throw 0;D=Object.assign(blank(),o,{unlocked:true});save();toast('記録を元に戻しました！');closeModal()}catch(e){toast('コードが正しくないみたい')}},'sub'))})}

/* ====== パスワード ====== */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryPw(){const v=$('#pw').value.trim();if(!v)return;let ok=false;try{ok=(await sha(v))===PW_HASH}catch(e){ok=false}
 if(ok){D.unlocked=true;save();$('#gate').classList.add('hidden');renderHome()}else $('#pwMsg').textContent='パスワードがちがうみたい。記事をもう一度見てね。'}
$('#pwGo').onclick=tryPw;$('#pw').onkeydown=e=>{if(e.key==='Enter')tryPw()};

const TAU=Math.PI*2,D2R=Math.PI/180;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(20261102);
const rr=(a,b)=>a+R()*(b-a);
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function hex4(h,em=0){return[...hex(h),em]}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function lerpAng(a,b,t){let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t}

/* ---------- mat4 (column-major) ---------- */
const M4={
 I(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m},
 mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
  for(let r=0;r<4;r++)o[c*4+r]=a[r]*b0+a[4+r]*b1+a[8+r]*b2+a[12+r]*b3}return o},
 c(...ms){let m=ms[0];for(let i=1;i<ms.length;i++)m=M4.mul(m,ms[i]);return m},
 T(x,y,z){const m=M4.I();m[12]=x;m[13]=y;m[14]=z;return m},
 S(x,y,z){const m=M4.I();m[0]=x;m[5]=y;m[10]=z;return m},
 RY(a){const m=M4.I(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m},
 RX(a){const m=M4.I(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m},
 RZ(a){const m=M4.I(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m},
 persp(f,asp,n,fa){const t=1/Math.tan(f/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(fa+n)/(n-fa);m[11]=-1;m[14]=2*fa*n/(n-fa);return m},
 lookAt(e,t,u){let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2];let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;const m=new Float32Array(16);
  m[0]=xx;m[4]=xy;m[8]=xz;m[1]=yx;m[5]=yy;m[9]=yz;m[2]=zx;m[6]=zy;m[10]=zz;
  m[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);m[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);m[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);m[15]=1;return m}
};
const IDENT=M4.I();

/* ---------- geometry (flat-shaded low poly) ---------- */
function finish(t,cx,cy,cz){const n=new Array(t.length);
 for(let i=0;i<t.length;i+=9){const ax=t[i],ay=t[i+1],az=t[i+2],bx=t[i+3]-ax,by=t[i+4]-ay,bz=t[i+5]-az,qx=t[i+6]-ax,qy=t[i+7]-ay,qz=t[i+8]-az;
  let nx=by*qz-bz*qy,ny=bz*qx-bx*qz,nz=bx*qy-by*qx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
  const mx=(t[i]+t[i+3]+t[i+6])/3-cx,my=(t[i+1]+t[i+4]+t[i+7])/3-cy,mz=(t[i+2]+t[i+5]+t[i+8])/3-cz;
  if(nx*mx+ny*my+nz*mz<0){nx=-nx;ny=-ny;nz=-nz}
  for(let k=0;k<3;k++){n[i+k*3]=nx;n[i+k*3+1]=ny;n[i+k*3+2]=nz}}
 return{p:t,n,count:t.length/3}}
function qp(t,a,b,c,d){t.push(...a,...b,...c,...a,...c,...d)}
const GC={};
function memo(k,f){return GC[k]||(GC[k]=f())}
function gBox(w,h,d,ox=0,oy=0,oz=0){return memo(`b${w},${h},${d},${ox},${oy},${oz}`,()=>{const x=w/2,y=h/2,z=d/2,t=[];const v=(i,j,k)=>[ox+i*x,oy+j*y,oz+k*z];
 qp(t,v(-1,-1,1),v(1,-1,1),v(1,1,1),v(-1,1,1));qp(t,v(1,-1,-1),v(-1,-1,-1),v(-1,1,-1),v(1,1,-1));
 qp(t,v(-1,1,1),v(1,1,1),v(1,1,-1),v(-1,1,-1));qp(t,v(-1,-1,-1),v(1,-1,-1),v(1,-1,1),v(-1,-1,1));
 qp(t,v(1,-1,1),v(1,-1,-1),v(1,1,-1),v(1,1,1));qp(t,v(-1,-1,-1),v(-1,-1,1),v(-1,1,1),v(-1,1,-1));return finish(t,ox,oy,oz)})}
function gCyl(rt,rb,h,seg=8,oy=0,ox=0,oz=0){return memo(`c${rt},${rb},${h},${seg},${oy},${ox},${oz}`,()=>{const t=[];
 for(let i=0;i<seg;i++){const a0=i/seg*TAU,a1=(i+1)/seg*TAU,c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
  const b0=[ox+c0*rb,oy,oz+s0*rb],b1=[ox+c1*rb,oy,oz+s1*rb],t0=[ox+c0*rt,oy+h,oz+s0*rt],t1=[ox+c1*rt,oy+h,oz+s1*rt];
  if(rt>0&&rb>0)qp(t,b0,b1,t1,t0);else if(rt<=0)t.push(...b0,...b1,...t0);else t.push(...b0,...t1,...t0);
  if(rt>0)t.push(ox,oy+h,oz,...t0,...t1);if(rb>0)t.push(ox,oy,oz,...b1,...b0)}
 return finish(t,ox,oy+h/2,oz)})}
function gSph(r,ws=8,hs=6,oy=0,ox=0,oz=0){return memo(`s${r},${ws},${hs},${oy},${ox},${oz}`,()=>{const t=[];
 const P=(i,j)=>{const th=j/hs*Math.PI,ph=i/ws*TAU;return[ox+r*Math.sin(th)*Math.cos(ph),oy+r*Math.cos(th),oz+r*Math.sin(th)*Math.sin(ph)]};
 for(let j=0;j<hs;j++)for(let i=0;i<ws;i++){const a=P(i,j),b=P(i+1,j),c=P(i+1,j+1),d=P(i,j+1);if(j>0)t.push(...a,...b,...c);if(j<hs-1)t.push(...a,...c,...d)}
 return finish(t,ox,oy,oz)})}

const VS=`attribute vec3 aP;attribute vec3 aN;attribute vec4 aC;uniform mat4 uVP;uniform mat4 uM;uniform vec3 uCam;uniform vec2 uFog;
varying vec3 vN;varying vec4 vC;varying vec3 vW;
void main(){vec4 w=uM*vec4(aP,1.0);gl_Position=uVP*w;vN=(uM*vec4(aN,0.0)).xyz;vC=aC;vW=w.xyz;}`;
const FS=`precision highp float;varying vec3 vN;varying vec4 vC;varying vec3 vW;uniform vec3 uLD;uniform vec3 uFogC;uniform vec3 uSky;uniform vec3 uGnd;uniform vec3 uCam;uniform vec2 uFog;
void main(){float vF=clamp((distance(vW,uCam)-uFog.x)/(uFog.y-uFog.x),0.0,1.0);vec3 N=normalize(vN);float d=max(dot(N,uLD),0.0);vec3 L=mix(uGnd,uSky,N.y*0.5+0.5)*0.66+vec3(1.0,0.97,0.9)*d*0.6;
vec3 c=vC.rgb*mix(L,vec3(1.0),vC.a);gl_FragColor=vec4(mix(c,uFogC,vF),1.0);}`;
const VT=`attribute vec3 aP;attribute vec2 aU;uniform mat4 uVP;uniform mat4 uM;uniform vec3 uCam;uniform vec2 uFog;varying vec2 vU;varying float vF;
void main(){vec4 w=uM*vec4(aP,1.0);gl_Position=uVP*w;vU=aU;float d=distance(w.xyz,uCam);vF=clamp((d-uFog.x)/(uFog.y-uFog.x),0.0,1.0);}`;
const FT=`precision mediump float;varying vec2 vU;varying float vF;uniform sampler2D uT;uniform vec3 uFogC;uniform float uA;
void main(){vec4 t=texture2D(uT,vU);if(t.a<0.03)discard;gl_FragColor=vec4(mix(t.rgb,uFogC,vF),t.a*uA);}`;
function mkProg(vs,fs,attrs){const p=gl.createProgram();
 for(const[s,ty]of[[vs,gl.VERTEX_SHADER],[fs,gl.FRAGMENT_SHADER]]){const sh=gl.createShader(ty);gl.shaderSource(sh,s);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh)}
 attrs.forEach((a,i)=>gl.bindAttribLocation(p,i,a));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
 const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);u[inf.name]=gl.getUniformLocation(p,inf.name)}return{p,u}}
let PC,PT;
function buf(arr){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,arr instanceof Float32Array?arr:new Float32Array(arr),gl.STATIC_DRAW);return b}
const GPU=new Map();
function gpu(g){let o=GPU.get(g);if(!o){o={pb:buf(g.p),nb:buf(g.n),count:g.count};GPU.set(g,o)}return o}
let QP,QU;
function initGL(){PC=mkProg(VS,FS,['aP','aN','aC']);PT=mkProg(VT,FT,['aP','aU']);
 QP=buf([-.5,-.5,0,.5,-.5,0,.5,.5,0,-.5,-.5,0,.5,.5,0,-.5,.5,0]);QU=buf([0,1,1,1,1,0,0,1,1,0,0,0])}

/* ---------- static world mesh (merged into one buffer) ---------- */
const ST={p:[],n:[],c:[]};let STG=null;
function addS(g,m,col,em=0,jit=0.07){const c=typeof col==='string'?hex(col):col;const P=ST.p,N=ST.n,C=ST.c;
 for(let i=0;i<g.p.length;i+=9){const f=1+(R()-.5)*jit;const cr=c[0]*f,cg=c[1]*f,cb=c[2]*f;
  for(let k=0;k<3;k++){const o=i+k*3,x=g.p[o],y=g.p[o+1],z=g.p[o+2],nx=g.n[o],ny=g.n[o+1],nz=g.n[o+2];
   P.push(m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14]);
   N.push(m[0]*nx+m[4]*ny+m[8]*nz,m[1]*nx+m[5]*ny+m[9]*nz,m[2]*nx+m[6]*ny+m[10]*nz);C.push(cr,cg,cb,em)}}}
function uploadStatic(){STG={pb:buf(ST.p),nb:buf(ST.n),cb:buf(ST.c),count:ST.p.length/3};ST.p=ST.n=ST.c=null}

/* ---------- collision ---------- */
const BOXES=[],CIRS=[];const PR=.42,STEP=.42;
function addBox(cx,cz,w,d,top){BOXES.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,top})}
function addCircle(x,z,r,top){CIRS.push({x,z,r,top})}
function hitBox(b,x,z){const cx=x<b.x0?b.x0:x>b.x1?b.x1:x,cz=z<b.z0?b.z0:z>b.z1?b.z1:z;const dx=x-cx,dz=z-cz;return dx*dx+dz*dz<PR*PR}
function hitCir(c,x,z){const dx=x-c.x,dz=z-c.z,r=c.r+PR;return dx*dx+dz*dz<r*r}
function groundAt(x,z,y){let h=0;for(const b of BOXES)if(b.top>h&&b.top<=y+STEP&&hitBox(b,x,z))h=b.top;for(const c of CIRS)if(c.top>h&&c.top<=y+STEP&&hitCir(c,x,z))h=c.top;return h}
let extraBlock=null;
function blocked(x,z,y){if(extraBlock&&extraBlock(x,z))return true;
 for(const b of BOXES)if(b.top>y+STEP&&hitBox(b,x,z))return true;for(const c of CIRS)if(c.top>y+STEP&&hitCir(c,x,z))return true;return false}

/* ---------- static helpers ---------- */
function box(x,y0,z,w,h,d,col,o={}){const m=o.rot?M4.mul(M4.T(x,y0,z),M4.RY(o.rot)):M4.T(x,y0,z);addS(gBox(w,h,d,0,h/2,0),m,col,o.em||0,o.jit??.07);
 if(o.col)addBox(x,z,w,d,o.top??y0+h)}
function cyl(x,y0,z,rt,rb,h,col,seg=8,o={}){addS(gCyl(rt,rb,h,seg),M4.T(x,y0,z),col,o.em||0,o.jit??.07);if(o.col)addCircle(x,z,o.cr??Math.max(rt,rb),o.top??y0+h)}
function sph(x,y,z,r,col,o={}){addS(gSph(r,o.ws||8,o.hs||6),o.m||M4.T(x,y,z),col,o.em||0,o.jit??.07)}

 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}

 constructor(cfg,opts={}){Object.assign(this,{x:0,y:0,z:0,rot:0,vy:0,phase:0,spd:0,walk:0,ground:true,bubble:null,bubbleT:0,ball:false});this.opts=opts;this.set(cfg)}

   white:hex4('#f4f4f4'),red:hex4('#e94b4b',.4),visor:hex4('#39c2ff',.6),gold:hex4('#ffcc1a',.2),ball:hex4('#ff8a1e')};

 // 海と島（ベースプレート）

 box(0,-2.3,0,124,2,124,'#d8c08a',{jit:0});
 for(let i=-15;i<15;i++)for(let j=-15;j<15;j++){const x=i*4+2,z=j*4+2;box(x,-.2,z,3.96,.2,3.96,(i+j)&1?'#5cbf4a':'#52b443',{jit:.02})}

 // スポーン
 box(0,0,0,7,.25,7,'#9aa0a6',{col:true,jit:0});box(0,.25,0,5,.06,5,'#ffffff',{jit:0,em:.3});
 const st=signTex('送迎ドリル WORLD','勉強のごほうびエリア',{w:1024,h:220});box(9,0,0,.6,4,10,'#16204a',{col:true,top:99,jit:0});quad(st,8.65,2.4,0,9.6,9.6/st.aspect,-Math.PI/2);
 // 教科ゾーン
 const ks=Object.keys(ZN);ks.forEach((k,i)=>{const a=-Math.PI/2+i/ks.length*Math.PI*2,zx=Math.round(Math.cos(a)*32),zz=Math.round(Math.sin(a)*32),c=ZC[k];
  box(zx,0,zz,16,.2,16,c,{col:true,jit:.05});

  addS(gBox(10,2,1,0,0,0),M4.c(M4.T(gx,6.2,gz),M4.RY(rot)),c);const t=signTex(ZN[k][0],ZN[k][1],{w:900,h:200});quad(t,gx+dx*.52,6.2,gz+dz*.52,9,9/t.aspect,rot);quad(t,gx-dx*.52,6.2,gz-dz*.52,9,9/t.aspect,rot+Math.PI);
  // たてもの
  const bx=zx-dx*4,bz=zz-dz*4;box(bx,.2,bz,8,5,8,'#f4f4f4',{col:true,top:99,jit:.03});box(bx,5.2,bz,9,1,9,c,{jit:0});box(bx,6.2,bz,6,1,6,c,{jit:0});
  if(k==='ma'){for(let h=0;h<4;h++)box(bx,7.2+h*2,bz,4-h*.6,2,4-h*.6,h%2?'#ffffff':c,{jit:0})}
  if(k==='ja'){for(let n=0;n<6;n++)bTree(zx+(R()-.5)*14,zz+(R()-.5)*14+(n%2?3:-3),.8)}
  const nx=zx+dx*2,nz=zz+dz*2;const ch=new Char({kit:'white',number:i+1,acc:k==='ma'?'robot':'cap',accColor:c,hairStyle:i%5,skin:SKINS[i%4]},{label:NPCN[k],style:'npc'});ch.x=nx;ch.z=nz;ch.rot=Math.atan2(-dx*-1,-dz*-1);NPC3.push(ch);
  INTER.push({x:nx,z:nz,r:3.2,label:'話す',sub:ZN[k][1],fn:()=>zoneTalk(k)})});
 // アスレチック（ジャンプで登る）
 const cols=['#e94b4b','#ff7a1a','#ffd23a','#35d07f','#3c7be0','#9b59d0','#ff6ab0'];let x=-20,z=20,y=0;
 for(let i=0;i<9;i++){y+=1;x+=[0,3,3,0,-3,-3,0,3,0][i];z+=[3,0,0,3,0,0,3,0,3][i];box(x,0,z,2.4,y,2.4,cols[i%7],{col:true,jit:0})}

 INTER.push({x,z:z+3.2,y,r:2.4,label:'ゴール！',sub:'アスレチック',fn:obbyGoal});
 const ot=signTex('ジャンプ チャレンジ','ブロックをのぼってゴールをめざそう',{w:900,h:200});box(-20,0,17,6,3,.5,'#16204a',{col:true,top:99,jit:0});quad(ot,-20,1.8,17.3,5.8,5.8/ot.aspect,0);
 // 木・雲
 for(let i=0;i<40;i++){const a=R()*Math.PI*2,r=44+R()*12,tx=Math.cos(a)*r,tz=Math.sin(a)*r;bTree(tx,tz,.8+R()*.5)}
 for(let i=0;i<12;i++){const cx=(R()-.5)*160,cz=(R()-.5)*160,cy=26+R()*8;box(cx,cy,cz,10,2.4,6,'#ffffff',{em:.6,jit:0});box(cx+3,cy+1.4,cz,5,2,4,'#ffffff',{em:.6,jit:0})}
 // くるくる回るコイン（かざり）
 for(let i=0;i<10;i++){const a=i/10*Math.PI*2,cx=Math.cos(a)*18,cz=Math.sin(a)*18;DYN3.push({g:gpu(gCyl(.6,.6,.15,10)),c:hex4('#ffd23a',.5),f:t=>M4.c(M4.T(cx,1.4+Math.sin(t*2+i)*.25,cz),M4.RY(t*2+i),M4.RX(Math.PI/2))})}

function zoneTalk(k){const g=D.settings.grade;if(!avail(k,g)){modal(NPCN[k],`<p>${ZN[k][1]}へようこそ！</p><p class="note">${SUBJ[k].n}は小3からだよ。ほかのゾーンにも行ってみてね。</p>`);return}
 modal(NPCN[k],`<p style="font-size:16px">${ZN[k][1]}へようこそ！<br>${g}の${subjName(k,g)}、3問チャレンジしてみる？</p><p class="note">正解1問で🪙1コイン</p>`,el=>{el.appendChild(btn('チャレンジ！',()=>miniQuiz(k)));el.appendChild(btn('あとで',closeW3Modal,'sub'))})}
function miniQuiz(k){const g=D.settings.grade,qs=buildQuiz(k,g,3);let i=0,ok=0;
 const show=()=>{const it=qs[i];const ch=[it.a,...it.ws].sort(()=>Math.random()-.5);
  modal(`${ZN[k][1]} ${i+1}/3`,`<div class="qs">${esc(it.sub||'答えはどれ？')}</div><div class="q${(it.long||it.q.length>14)?' long':it.ja?' ja':''}">${esc(it.q)}</div><div id="cs">${ch.map((c,n)=>`<button class="ch" data-n="${n}">${esc(c)}</button>`).join('')}</div><div id="nx"></div>`,el=>{
   if(it.speak&&it.speakNow)say(it.speak,'en',.9);
   el.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const cs=el.querySelector('#cs');if(cs.dataset.d)return;cs.dataset.d=1;const good=ch[+b.dataset.n]===it.a;if(good)ok++;
    if(it.id){const V=D.vocab;V[it.id]=V[it.id]||{ok:0,ng:0};good?V[it.id].ok++:V[it.id].ng++}
    el.querySelectorAll('.ch').forEach(x=>{if(ch[+x.dataset.n]===it.a)x.classList.add('ok');else if(x===b)x.classList.add('ng')});
    const nx=el.querySelector('#nx');nx.innerHTML=`<div class="qs" style="margin:8px 0">${good?'⭕ 正解！ 🪙+1':'❌ おしい！'}</div>${it.e?`<div class="box" style="font-size:13px">${esc(it.e)}</div>`:''}`;
    nx.appendChild(btn(i<2?'次へ ▶':'おわり',()=>{i++;i<3?show():fin()}))})})};
 const fin=()=>{D.coins=(D.coins||0)+ok;save();P&&P.say(ok===3?'🎉':ok?'👍':'💪');modal('けっか',`<div class="q">${ok}<span style="font-size:.45em;color:var(--sub)"> / 3</span></div><div class="qs">🪙 ${ok}コインゲット！（合計 ${D.coins}）</div>`,el=>el.appendChild(btn('ワールドにもどる',closeW3Modal)));w3Hud()};show()}

const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(ptrs.size===1){cam.yaw-=dx*.0065;cam.pitch=clamp(cam.pitch+dy*.005,.08,1.2)}else if(ptrs.size===2){const o=[...ptrs.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d1>0)cam.dist=clamp(cam.dist*d0/d1,4,18)}p.x=e.clientX;p.y=e.clientY});

const JY=$('#joy'),KN=$('#knob');
JY.addEventListener('pointerdown',e=>{joy.id=e.pointerId;JY.setPointerCapture(e.pointerId);jm(e);e.preventDefault()});

const je=e=>{if(e.pointerId!==joy.id)return;joy={x:0,y:0,id:null};KN.style.transform=''};JY.addEventListener('pointerup',je);JY.addEventListener('pointercancel',je);
function jm(e){const r=JY.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=r.width*.38,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;KN.style.transform=`translate(${dx}px,${dy}px)`}

/* ---------- ループ ---------- */
let last3=0,t3=0;
function phys(ch,mx,mz,dt){const nx=ch.x+mx*dt;if(!blocked(nx,ch.z,ch.y))ch.x=nx;const nz=ch.z+mz*dt;if(!blocked(ch.x,nz,ch.y))ch.z=nz;
 const py=ch.y;ch.vy-=26*dt;ch.y+=ch.vy*dt;const g=groundAt(ch.x,ch.z,Math.max(py,ch.y));if(ch.y<=g){ch.y=g;ch.vy=0;ch.ground=true}else ch.ground=ch.y-g<.02;ch.gy=g;
 const sp=Math.hypot(mx,mz);ch.walk=lerp(ch.walk,sp>.6?1:0,Math.min(1,dt*10));ch.phase+=dt*sp*1.55}
function loop3(now){if(!W3.on)return;const dt=Math.min(.05,(now-last3)/1000);last3=now;t3+=dt;
 const free=modalClosed();let ix=0,iz=0;if(free){ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;iz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y}
 let l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l;l=1}
 const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw),mx=(fx*iz+rx*ix)*7.5,mz=(fz*iz+rz*ix)*7.5;
 if(l>.08)P.rot=lerpAng(P.rot,Math.atan2(mx,mz),Math.min(1,dt*12));
 if(jumpQ&&P.ground&&free){P.vy=9.8;P.ground=false}jumpQ=false;phys(P,mx,mz,dt);if(P.y<-6){P.x=0;P.z=3;P.y=.3;P.vy=0}
 if(P.bubbleT>0)P.bubbleT-=dt;
 curI=null;if(free){let bd=1e9;for(const it of INTER){const d=Math.hypot(it.x-P.x,it.z-P.z);if(d<it.r&&d<bd&&Math.abs((it.y||0)-P.y)<1.8){bd=d;curI=it}}}
 const ba=$('#bAct');if(curI){ba.classList.remove('hidden');ba.innerHTML=`${curI.label}<small>${esc(curI.sub)}</small>`}else ba.classList.add('hidden');
 cam.tx=lerp(cam.tx,P.x,Math.min(1,dt*12));cam.tz=lerp(cam.tz,P.z,Math.min(1,dt*12));cam.ty=lerp(cam.ty,P.y+1.5,Math.min(1,dt*8));
 cam.x=cam.tx+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist;cam.y=Math.max(.6,cam.ty+Math.sin(cam.pitch)*cam.dist);cam.z=cam.tz+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist;
 try{draw3()}catch(e){console.error(e)}requestAnimationFrame(loop3)}
const SKY3=hex('#8fd3ff');
function draw3(){const W=cv.width,H=cv.height;gl.viewport(0,0,W,H);gl.clearColor(SKY3[0],SKY3[1],SKY3[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const V=M4.lookAt([cam.x,cam.y,cam.z],[cam.tx,cam.ty,cam.tz],[0,1,0]),VP=M4.mul(M4.persp(58*D2R,W/H,.3,400),V),fog=[90,260];
 const D3=[],TX=[],SP=[],SH=[];P.draw(D3,TX,SP,SH);for(const n of NPC3){n.walk=0;n.gy=n.gy??.2;n.y=.2;n.draw(D3,TX,SP,SH)}for(const o of DYN3)D3.push({g:o.g,m:o.f(t3),c:o.c});
 if(curI)SP.push({tex:SPARK,x:curI.x,y:(curI.y||.2)+.15,z:curI.z,w:1.6,h:1.6,flat:true});
 gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.depthMask(true);gl.useProgram(PC.p);const u=PC.u;
 gl.uniformMatrix4fv(u.uVP,false,VP);gl.uniform3f(u.uCam,cam.x,cam.y,cam.z);gl.uniform2f(u.uFog,fog[0],fog[1]);gl.uniform3fv(u.uFogC,SKY3);
 gl.uniform3f(u.uLD,.45/1.03,.8/1.03,.35/1.03);gl.uniform3f(u.uSky,1,1,1.04);gl.uniform3f(u.uGnd,.62,.6,.58);gl.uniformMatrix4fv(u.uM,false,IDENT);
 gl.bindBuffer(gl.ARRAY_BUFFER,STG.pb);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,STG.nb);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,STG.cb);gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,4,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,STG.count);gl.disableVertexAttribArray(2);
 let lg=null;for(const o of D3){if(o.g!==lg){gl.bindBuffer(gl.ARRAY_BUFFER,o.g.pb);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,o.g.nb);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);lg=o.g}gl.vertexAttrib4fv(2,o.c);gl.uniformMatrix4fv(u.uM,false,o.m);gl.drawArrays(gl.TRIANGLES,0,o.g.count)}
 gl.useProgram(PT.p);const t=PT.u;gl.uniformMatrix4fv(t.uVP,false,VP);gl.uniform3f(t.uCam,cam.x,cam.y,cam.z);gl.uniform2f(t.uFog,fog[0],fog[1]);gl.uniform3fv(t.uFogC,SKY3);gl.uniform1i(t.uT,0);gl.activeTexture(gl.TEXTURE0);
 gl.bindBuffer(gl.ARRAY_BUFFER,QP);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,QU);gl.vertexAttribPointer(1,2,gl.FLOAT,false,0,0);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.uniform1f(t.uA,1);
 const dq=(tex,m)=>{gl.bindTexture(gl.TEXTURE_2D,tex.t);gl.uniformMatrix4fv(t.uM,false,m);gl.drawArrays(gl.TRIANGLES,0,6)};
 for(const q of SQ)dq(q.tex,q.m);for(const q of TX)dq(q.tex,q.m);
 gl.depthMask(false);for(const s of SH)dq(SHADOW,M4.c(M4.T(s.x,s.y+.05,s.z),M4.RX(-Math.PI/2),M4.S(s.s,s.s,1)));
 const rx=[V[0],V[4],V[8]],uy=[V[1],V[5],V[9]];
 for(const s of SP){let m;if(s.flat)m=M4.c(M4.T(s.x,s.y,s.z),M4.RX(-Math.PI/2),M4.S(s.w,s.h,1));else{m=new Float32Array(16);m[0]=rx[0]*s.w;m[1]=rx[1]*s.w;m[2]=rx[2]*s.w;m[4]=uy[0]*s.h;m[5]=uy[1]*s.h;m[6]=uy[2]*s.h;m[10]=1;m[12]=s.x;m[13]=s.y;m[14]=s.z;m[15]=1;gl.depthMask(true)}dq(s.tex,m)}
 gl.depthMask(true)}
