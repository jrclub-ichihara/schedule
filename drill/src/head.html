<style>
/* ゲームのロビー風：あおい空の放射線＋太いフチどりのパネル。ずっと同じ見た目（ダークひとつ） */
:root{color-scheme:dark;
 --ink:#0a1240;--bg0:#12207a;--bg1:#2d5ae6;--panel:#1d36a8;--panel2:#162a86;--line:#0a1240;
 --tx:#ffffff;--sub:#c9d6ff;--y1:#ffe14d;--y2:#ffb300;--g1:#5cf08f;--g2:#1fb85a;--r1:#ff6b7a;--r2:#e0324a;--or:#ff8a1e;--or2:#ffc23d;--ok:#3ee07a;--ng:#ff4d5e;--card:#2440bd;
 --fd:'Lilita One','M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;--fb:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
 --ol:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -1px 0 var(--ink),-2px -1px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink);
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--tx);font-family:var(--fb);-webkit-tap-highlight-color:transparent}
body{background:var(--bg0);background-image:repeating-conic-gradient(from 0deg at 50% 18%,rgba(255,255,255,.06) 0 7deg,rgba(255,255,255,0) 7deg 16deg),radial-gradient(120% 80% at 50% 10%,var(--bg1),var(--bg0) 70%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--y1);outline-offset:2px}
.hidden{display:none!important}
.ol{-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}
.wrap{max-width:540px;margin:0 auto;padding-top:calc(12px + var(--st));padding-bottom:calc(30px + var(--sb));padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr))}
.top{display:flex;align-items:center;gap:8px}
.logo{font-family:var(--fd);font-weight:900;font-size:24px;letter-spacing:.02em;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);margin-right:auto;line-height:1}.logo span{color:var(--y1)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;font-family:var(--fd);font-size:18px;line-height:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.pill.coin::before{content:"";width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffcf1f 45%,#d48a00);border:2px solid var(--ink);flex:none}
.pill.coin{font-size:18px}
.pill.coin.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.sm{background:var(--panel2);border:3px solid var(--ink);border-radius:12px;font-size:12px;padding:6px 10px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.hello{color:var(--sub);font-size:13px;margin:10px 0 0;font-weight:800}
.hero{margin:12px 0 4px;padding:14px 16px 16px;border-radius:20px;background:linear-gradient(180deg,#ffd84a,#ff9d1e);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.5);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,rgba(255,255,255,.14) 0 14px,transparent 14px 34px);pointer-events:none}
.heroT{font-family:var(--fd);font-size:clamp(34px,10vw,46px);line-height:1;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);position:relative;z-index:1}
.heroS{font-weight:900;font-size:13px;margin-top:6px;color:#4a2400;position:relative;z-index:1}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(180deg,var(--card),var(--panel2));border:3px solid var(--ink);border-radius:18px;padding:12px;margin:12px 0;box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.16)}
.card:active,.btn:active,.gbtn:active,.it:active,.tool:active,.tab:active,.sideb:active,.chip:active{transform:translateY(3px) scale(.985,.96);box-shadow:0 2px 0 var(--ink)!important;transition:transform .05s}
.card,.btn,.gbtn,.it,.tool,.tab,.sideb,.chip,.st{transition:transform .18s cubic-bezier(.3,1.8,.5,1),filter .15s}
@media (hover:hover){.card:hover,.btn:hover,.gbtn:hover,.it:hover,.tool:hover,.sideb:hover,.chip:hover{transform:translateY(-2px);filter:brightness(1.06)}}
.btn,.gbtn,.sideb,.st,.tool,.tab.on,.chip.on,.x,#bJump,.hero,.card{position:relative;overflow:hidden;isolation:isolate}
.btn::before,.gbtn::before,.sideb::before,.st::before,.tool::before,.tab.on::before,.chip.on::before,.x::before,.card::before{content:"";position:absolute;left:5%;right:5%;top:3px;height:42%;border-radius:999px 999px 40% 40%/100% 100% 30% 30%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.05));pointer-events:none;z-index:-1}
.card::before{left:2%;right:2%;height:36%;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0))}

.flycoin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8c0,#ffd21f 45%,#d48a00);border:3px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);z-index:40;pointer-events:none}
.mbox{animation:sheet .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes sheet{0%{transform:translateY(70px);opacity:.4}100%{transform:none;opacity:1}}
.coinbig{position:relative;isolation:isolate}
.coinbig::before{content:"";position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;z-index:-1;background:repeating-conic-gradient(rgba(255,225,77,.42) 0 12deg,rgba(255,225,77,0) 12deg 30deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{animation:wob 4s ease-in-out infinite;transform-origin:left center}

.wcTop{position:relative;display:flex;align-items:flex-end;gap:4px}
.wcTop>div{flex:1;min-width:0}
.avc{width:138px;height:138px;flex:none;margin:-12px -10px -18px 0;filter:drop-shadow(0 6px 0 rgba(10,18,64,.35))}
.wcT{font-size:clamp(24px,7.2vw,30px)}
.card.main{background:linear-gradient(180deg,#3a63f0,#2440bd)}
.ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:rgba(10,18,64,.45);border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.card h3{margin:0;font-size:19px;font-weight:900;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}.card p{margin:3px 0 0;font-size:12px;color:var(--sub);font-weight:800}
.st{margin-left:auto;flex:none;font-family:var(--fd);font-size:15px;color:var(--ink);background:linear-gradient(180deg,var(--y1),var(--y2));border:3px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 var(--ink)}
.st:empty{display:none}
.st.done{background:linear-gradient(180deg,var(--g1),var(--g2));color:#fff;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}
.worldc{position:relative;margin:16px 0 12px;padding:14px;border-radius:20px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.25);overflow:hidden;
 background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(10,18,64,.35)),linear-gradient(180deg,#58c8ff 0,#8fe0ff 46%,#6fd05a 46%,#4fb444 100%)}
.worldc::before{content:"";position:absolute;left:-10%;right:-10%;top:46%;height:40%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 28px,transparent 28px 56px);transform:perspective(200px) rotateX(55deg);transform-origin:top;pointer-events:none}
.wcT{position:relative;font-family:var(--fd);font-size:30px;line-height:1;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}
.wcS{position:relative;font-size:12px;font-weight:900;margin-top:6px;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}
.wcC{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wcC span{background:rgba(10,18,64,.6);border:2px solid var(--ink);border-radius:10px;padding:3px 8px;font-size:11px;font-weight:900}
.wcB{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{margin:20px 0 8px;font-weight:900;font-size:15px;display:flex;align-items:baseline;gap:8px;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}.sec small{font-weight:800;color:var(--sub);font-size:11px;text-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.week{display:flex;gap:5px}

.week .today{background:#3a63f0;color:#fff;outline:3px solid var(--y1);outline-offset:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel2);border:3px solid var(--ink);border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--fd);font-size:26px;color:var(--y1);-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}.stats span{font-size:11px;color:var(--sub);font-weight:800}
.btn,.gbtn{display:block;width:100%;border:3px solid var(--ink);border-radius:16px;padding:12px;font-size:17px;font-weight:900;background:linear-gradient(180deg,var(--y1),var(--y2));color:#fff;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.5);margin-top:12px;font-family:var(--fd),var(--fb);letter-spacing:.02em}
.btn.go,.gbtn.go{background:linear-gradient(180deg,var(--g1),var(--g2))}
.btn.sub{background:linear-gradient(180deg,#4a6ff0,#2a48c4);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.25)}

.btn.play{font-size:24px;padding:12px}

.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* modal */
#modal{position:fixed;inset:0;z-index:25;background:rgba(5,10,40,.6);display:flex;align-items:flex-end;justify-content:center}
.mbox{width:min(560px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#2747c2,#1a2f8f);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:14px max(16px,var(--sr)) calc(24px + var(--sb)) max(16px,var(--sl));box-shadow:inset 0 3px 0 rgba(255,255,255,.2)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}

.x{background:linear-gradient(180deg,var(--r1),var(--r2));border:3px solid var(--ink);border-radius:12px;width:40px;height:40px;font-size:16px;font-weight:900;box-shadow:0 3px 0 var(--ink);flex:none;-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink)}
.bar{display:flex;gap:4px}.bar i{flex:1;height:9px;border-radius:5px;background:rgba(10,18,64,.6);border:2px solid var(--ink)}.bar .ok{background:var(--ok)}.bar .ng{background:var(--ng)}.bar .cur{background:var(--y1)}

.box{background:rgba(10,18,64,.4);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:800}

.coinbig{text-align:center;font-family:var(--fd);font-size:40px;color:var(--y1);-webkit-text-stroke:var(--sw,.2em) var(--ink);paint-order:stroke fill;text-shadow:0 .1em 0 var(--ink);margin:6px 0 4px;animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
.coinrow{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;margin:6px 0}
.welc p{margin:8px 0;font-size:15px;font-weight:800;line-height:1.6}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:900}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px;font-weight:800}

.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

#listen{position:fixed;inset:0;z-index:30;background:#0a1240;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}

.bd-bot{gap:7px}

.tool b{display:block;font-size:20px;line-height:1.15;text-shadow:none}
.tool.on{background:linear-gradient(180deg,var(--y1),var(--y2))}
.tool.warn{background:linear-gradient(180deg,var(--r1),var(--r2))}
.tool:disabled{opacity:.45}
.pal{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}

.bd-hint{font-size:11px;color:var(--sub);font-weight:800;text-align:center}
