<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jr.CLUB市原 TEAM ALBUM</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style>/*ALBUM_CSS*/</style>
<link rel="stylesheet" href="common.css">
<style>
body{background:var(--ink)!important}
main{padding:12px 16px 56px!important}
.lb{background:#050505!important;z-index:300!important}.pk{z-index:320!important}
.card{background:linear-gradient(160deg,#1c1c19,#121210)!important;border:1px solid var(--line)!important;border-radius:14px!important}
.yrs button{border-radius:12px!important;border:1px solid var(--line)!important;background:linear-gradient(160deg,#1c1c19,#121210)!important;color:#bdbbb4!important;font:900 italic 13px/1 var(--disp)!important;letter-spacing:.05em;padding:10px 14px!important}
.yrs button.on{border-color:var(--y)!important;color:#fff!important;box-shadow:0 0 0 3px rgba(255,235,59,.1)}
.tabs{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;border:0!important;margin-bottom:14px!important}
.tabs button{border:1px solid var(--line)!important;border-radius:12px!important;background:linear-gradient(160deg,#1c1c19,#121210)!important;color:var(--mute)!important;padding:10px!important;font-size:12px!important;transition:transform .25s var(--ease)}
.tabs button:before{display:block;font:900 italic 13px/1 var(--disp);letter-spacing:.06em;color:#bdbbb4;margin-bottom:4px}
.tabs button[data-v=a]:before{content:"ALBUMS"}.tabs button[data-v=p]:before{content:"PLAYERS"}
.tabs button.on{border-color:var(--y)!important;color:var(--y)!important;box-shadow:0 0 0 3px rgba(255,235,59,.1);background:linear-gradient(160deg,#25230f,#121210)!important}.tabs button.on:before{color:#fff}
.tabs button:active,.alb:active,.chips button:active{transform:scale(.97)}
.alb{border-radius:14px!important;border:1px solid var(--line)!important;background:linear-gradient(160deg,#1c1c19,#121210)!important;transition:transform .25s var(--ease),border-color .3s}
.alb .cv img{transition:transform 1.2s var(--ease)}.alb.in .cv img{transform:scale(1.04)}
.alb b{color:#fff}
.addAlb{border-radius:14px!important;font:900 italic 14px/1 var(--disp)!important;letter-spacing:.04em;padding:15px!important;box-shadow:0 8px 24px rgba(255,235,59,.18)}
.addAlb.add2{box-shadow:none}
.chips button{border-radius:12px!important;border:1px solid var(--line)!important;background:linear-gradient(160deg,#1c1c19,#121210)!important;transition:transform .25s var(--ease)}
.chips button.on{background:var(--y)!important;color:#000!important}
.hd button{border-radius:12px!important;border:1px solid var(--line)!important;background:linear-gradient(160deg,#1c1c19,#121210)!important;font-weight:800}
.ph div{border-radius:6px}
.help a{font-weight:800}
@media(hover:hover){.alb:hover,.chips button:hover,.tabs button:hover{border-color:rgba(255,235,59,.5)!important}}
</style>
</head>
<body>
<header class="hero"><div class="big">ALBUM</div><div class="rush"></div><div class="in">
  <img src="logo.jpg" alt="ICHIHARA">
  <div><h1 data-split>TEAM ALBUM</h1><p>Jr.CLUB市原の思い出</p><div class="tg">POUNDING THE ROCK</div></div>
</div></header>
<div style="max-width:720px;margin:0 auto;padding:12px 16px 0"><div class="topnav" style="margin:0"><a class="tile back" href="./">‹ <b>SCHEDULE</b><small>予定表にもどる</small></a></div></div>
<script src="common.js"></script>
<script>JR.shim();</script>
<!--ALBUM_BODY-->
<script>
/* 表示後のふわっと（アルバム一覧・写真が描かれるたびに） */
(function(){var v=document.getElementById('view');if(!v)return;new MutationObserver(function(){JR.reveal(v,'.alb,.chips button,.ph div,.addAlb')}).observe(v,{childList:true,subtree:true})})();
</script>
</body>
</html>
