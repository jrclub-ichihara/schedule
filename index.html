<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<title>Jr.CLUB市原 予定表</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style id="apiCss"></style>
<style>
:root{--ink:#1d1d1b;--y:#ffeb3b;--bg:#f6f6f4;--line:#e3e1db;--mute:#77756f;--ease:cubic-bezier(.2,.75,.2,1)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
/* ヘッダー */
.hero{position:relative;overflow:hidden;background:var(--ink);color:var(--y);padding:18px 16px 16px;padding-top:max(18px,env(safe-area-inset-top))}
.hero:before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;background:radial-gradient(circle,rgba(255,235,59,.18),transparent 65%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{transform:translate(-40px,30px) scale(1.15)}}
.hero .in{position:relative;display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.hero img{width:52px;height:58px;border-radius:6px;flex:none;opacity:0;transform:scale(.85);animation:pop .7s var(--ease) .05s forwards}
.hero h1{margin:0;font-size:18px;letter-spacing:.02em}
.hero h1 span{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(8px);animation:soft .7s var(--ease) forwards}
.hero p{margin:4px 0 0;font-size:12px;color:#fff;opacity:0;animation:fade .8s ease .55s forwards}
.hero .tg{font-size:10px;letter-spacing:.22em;opacity:0;margin-top:3px;animation:fade 1s ease .8s forwards}
@keyframes soft{to{opacity:1;filter:blur(0);transform:none}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:.85}}
main{padding:12px 16px 48px;max-width:560px;margin:0 auto}
/* 月タブ（下のバーが滑る） */
.mtabs{position:sticky;top:0;z-index:20;background:rgba(246,246,244,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin:0 -16px 10px;padding:10px 16px 8px}
.mt-in{position:relative;display:flex;gap:6px;max-width:560px;margin:0 auto}
.mt-in button{flex:1;position:relative;z-index:1;border:0;background:none;border-radius:10px;padding:10px 0;font-weight:800;font-size:15px;color:var(--mute);transition:color .35s var(--ease)}
.mt-in button.on{color:var(--y)}
.mt-in .pill{position:absolute;top:0;bottom:0;left:0;border-radius:10px;background:var(--ink);transition:transform .45s var(--ease),width .45s var(--ease);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.sub{display:flex;gap:6px;margin:0 0 14px}
.sub a,.sub button{flex:1;text-align:center;border-radius:999px;padding:9px 0;font-size:13px;font-weight:800;text-decoration:none;background:var(--ink);color:var(--y);border:1.5px solid var(--ink);font-family:inherit;transition:transform .2s}
.sub .on{background:var(--y);color:var(--ink)}
.sub a:active,.sub button:active{transform:scale(.96)}
/* 中身の切り替え */
#view{transition:opacity .25s ease,transform .35s var(--ease)}
#view.out{opacity:0;transform:translateY(6px)}
/* カードがふわっと出る */
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.day.past.rv.in{opacity:.4}
.day{transition:box-shadow .3s}
.day:active{transform:scale(.99)}
details .dt{animation:open .35s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* 読み込み中 */
.sk{height:64px;border-radius:12px;margin-bottom:8px;background:linear-gradient(90deg,#ebeae6 25%,#f4f3f0 50%,#ebeae6 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.upd{text-align:center;font-size:11px;color:var(--mute);margin:16px 0 0}
.err{background:#fde8e6;color:#a33;border-radius:12px;padding:12px;font-size:13px;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.hero h1 span,.hero p,.hero .tg,.hero img{opacity:1!important;filter:none!important;transform:none!important}}
</style>
</head>
<body>
<header class="hero"><div class="in">
  <img src="logo.jpg" alt="ICHIHARA">
  <div><h1 id="ttl"></h1><p id="sub">試合は押すと詳しく見られます</p><div class="tg">POUNDING THE ROCK</div></div>
</div></header>
<main>
  <nav class="mtabs"><div class="mt-in" id="tabs"><span class="pill" id="pill"></span></div></nav>
  <div class="sub" id="sub2"></div>
  <div id="view"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div id="links"></div>
  <p class="upd" id="upd"></p>
</main>
<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbwB-_TuXQhHCfWU0GYXXQq9Fm8mdG7bFzOEHE3CJLB3LoYam0eGmSPQlHNJHY49stKs/exec?api=schedule';
var KEY='jrclub_sched_v1',D=null,CUR='',VIEW='card',$=function(i){return document.getElementById(i)};
// タイトルを1文字ずつふわっと
var t='Jr.CLUB市原 予定表';$('ttl').innerHTML=t.split('').map(function(c,i){return '<span style="animation-delay:'+(0.12+i*0.04)+'s">'+(c===' '?'&nbsp;':c)+'</span>'}).join('');
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -6% 0px'}):null;
function reveal(root){var els=root.querySelectorAll('.day,.tp-hero,.tp-goal,.tp-r,.tp-rw,.tp-teaser,.pre,.mt-wrap,.lk2 a'),n=0;
  [].forEach.call(els,function(el){el.classList.add('rv');var r=el.getBoundingClientRect();
    if(r.top<innerHeight){el.style.transitionDelay=Math.min(n++*45,400)+'ms';requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('in')})});setTimeout(function(){el.style.transitionDelay=''},1200)}
    else if(io)io.observe(el);else el.classList.add('in')})}
function tabs(){var h='<span class="pill" id="pill"></span>'+D.months.map(function(x){return '<button data-k="'+x.key+'">'+x.m+'月</button>'}).join('');$('tabs').innerHTML=h;
  [].forEach.call($('tabs').querySelectorAll('button'),function(b){b.onclick=function(){go(b.dataset.k)}});
  var u=D.url||'';$('sub2').innerHTML='<button id="tp3">🏀 3P</button><a href="'+u+'?mode=roster">👥 選手</a><a href="'+u+'?mode=album">📸 アルバム</a>';
  $('tp3').onclick=function(){go('3p')};$('links').innerHTML=D.links||'';reveal($('links'))}
function pill(){var on=$('tabs').querySelector('button.on'),p=$('pill');if(!p)return;if(!on){p.style.opacity=0;return}
  p.style.opacity=1;p.style.width=on.offsetWidth+'px';p.style.transform='translateX('+on.offsetLeft+'px)'}
function go(k,first){CUR=k;[].forEach.call($('tabs').querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===k)});
  $('tp3')&&$('tp3').classList.toggle('on',k==='3p');pill();
  var mo=D.months.filter(function(x){return x.key===k})[0];
  $('sub').textContent=k==='3p'?'3Pシュート チャレンジ':(mo?mo.y+'年'+mo.m+'月　':'')+'試合は押すと詳しく見られます';
  var html=k==='3p'?D.tp:(mo?mo.main:'');
  var v=$('view');v.classList.add('out');
  setTimeout(function(){v.innerHTML=html;applyView();v.classList.remove('out');reveal(v);
    var td=document.getElementById('today');if(first&&td&&td.offsetParent)setTimeout(function(){td.scrollIntoView({block:'center',behavior:'smooth'})},500);
    else if(!first)window.scrollTo({top:0,behavior:'smooth'})},first?0:180)}
function applyView(){var c=$('vCard'),tb=$('vTable');if(!c||!tb)return;var tbl=VIEW==='table';c.style.display=tbl?'none':'';tb.style.display=tbl?'':'none';
  [].forEach.call(document.querySelectorAll('[data-vw]'),function(x){x.classList.toggle('on',x.dataset.vw===VIEW)});if(tbl)reveal(tb)}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-vw]');if(a){e.preventDefault();VIEW=a.dataset.vw;applyView();return}
  var tp=e.target.closest('a.tp-teaser');if(tp){e.preventDefault();go('3p');return}
  var ln=e.target.closest('a[href]');if(ln&&/[?&]mode=schedule/.test(ln.href)){e.preventDefault();var m=ln.href.match(/[?&]m=([^&]+)/);if(m)go(decodeURIComponent(m[1]));}});
addEventListener('resize',pill);
function show(d,first){D=d;$('apiCss').textContent=d.css||'';tabs();
  var k=(CUR&&(CUR==='3p'||d.months.some(function(x){return x.key===CUR})))?CUR:(d.months.some(function(x){return x.key===d.cur})?d.cur:d.months[0].key);
  go(k,first);$('upd').textContent='最終更新 '+d.at}
var cache=load();if(cache&&cache.months){show(cache,true)}
function fetchNew(n){fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(!d||!d.ok)throw 0;
    var changed=!cache||JSON.stringify(cache.months)!==JSON.stringify(d.months)||cache.tp!==d.tp;save(d);
    if(!cache)show(d,true);else if(changed){var y=scrollY;show(d,false);setTimeout(function(){scrollTo(0,y)},250)}else $('upd').textContent='最終更新 '+d.at;cache=d})
  .catch(function(){if(n<1)return setTimeout(function(){fetchNew(n+1)},1500);if(!cache)$('view').innerHTML='<div class="err">予定を読み込めませんでした。電波の良いところで開き直してください。</div>'})}
fetchNew(0);
})();
</script>
</body>
</html>
