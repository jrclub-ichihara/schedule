<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jr.CLUB市原 予定表</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<style id="apiCss"></style>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="club-fonts.css">
<link rel="stylesheet" href="club.css?v=2">
<style>
/* 予定表のページだけで使うもの（色・文字・部品は club.css） */
body { background: var(--bg); color: var(--text); }
main { max-width: 560px; background: none; }
.hero .in { max-width: 560px; }
.hero { min-height: 168px; display: flex; align-items: center; }
.hero .in { width: 100%; }
#view { transition: opacity 0.22s ease, transform 0.32s var(--ease); }
#view.out { opacity: 0; transform: translateY(8px); }
.rv { opacity: 0; transform: translateY(22px) scale(0.98); transition: opacity 0.6s var(--ease), transform 0.7s var(--ease); }
.rv.in { opacity: 1; transform: none; }
.day.past.rv.in { opacity: 0.45; }
.sk { height: 76px; border-radius: var(--r-card); margin-bottom: 10px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.err { background: rgba(255, 113, 99, 0.15); color: var(--text); border-radius: var(--r-ctl); padding: 12px 14px; font-size: var(--fs-sm); margin-bottom: 10px; }
@media (prefers-reduced-motion: reduce) { .rv { transform: none; transition: opacity 0.3s ease; } }
</style>
</head>
<body class="page-sched">
<header class="hero"><canvas class="court" id="court" aria-hidden="true"></canvas><div class="big" aria-hidden="true">SCHEDULE</div><div class="in">
  <div class="logo" id="logo" role="img" aria-label="Jr.CLUB市原のロゴ"></div>
  <div><h1 id="ttl">SCHEDULE</h1><p id="sub">Jr.CLUB市原 予定表</p><div class="tg">POUNDING THE ROCK</div></div>
</div></header>
<main>
  <nav class="mtabs"><div class="mt-in" id="tabs"><span class="pill" id="pill"></span></div></nav>
  <div class="sub" id="sub2"></div>
  <div id="next"></div>
  <div id="view"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div id="links"></div>
  <div class="foot" id="foot"></div>
  <p class="upd" id="upd"></p>
</main>
<script src="club.js?v=1"></script>
<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbwB-_TuXQhHCfWU0GYXXQq9Fm8mdG7bFzOEHE3CJLB3LoYam0eGmSPQlHNJHY49stKs/exec?api=schedule';
var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];var KEY='jrclub_sched_v1',D=null,CUR='',VIEW='card',$=function(i){return document.getElementById(i)};
// 線で描くロゴ・上の動く絵・ページのいちばん下
$('logo').innerHTML=TEAM.lockup();$('foot').innerHTML=TEAM.mark()+'<p>Pounding the Rock</p>';
var COURT=TEAM.hero($('court'));
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -6% 0px'}):null;
var IC={album:'<svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.6"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4h16v-4"/></svg>',
 yasumi:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M9.5 13.5l5 4M14.5 13.5l-5 4"/></svg>',
 ball:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3.2 3 3.2 9.8 0 12.8M18.4 5.6c-3.2 3-3.2 9.8 0 12.8"/></svg>'};
var EN={album:'ALBUM',up:'UPLOAD',yasumi:'ABSENCE'};
function tiles(root){[].forEach.call(root.querySelectorAll('.lk2 a'),function(a){if(a.dataset.ok)return;a.dataset.ok=1;var m=(a.getAttribute('href')||'').match(/mode=(\w+)/),k=m&&m[1];if(!IC[k])return;
    var b=a.querySelector('b'),sp=a.querySelector('span'),jp=(b?b.textContent:'').replace(/^[^぀-ヿ一-龯]+/,'').trim();
    a.setAttribute('href',{album:'album.html',up:'upload.html',yasumi:'absence.html'}[k]);a.removeAttribute('target');a.innerHTML='<i>›</i>'+IC[k]+'<div><b>'+EN[k]+'</b><em>'+jp+'</em><span>'+(sp?sp.textContent:'')+'</span></div>'});
  [].forEach.call(root.querySelectorAll('a.tp-teaser'),function(a){if(a.dataset.ok)return;a.dataset.ok=1;var t=a.textContent.replace(/^.*?3Pチャレンジ/,'').trim();
    a.innerHTML='<i>›</i>'+IC.ball+'<div><b>3POINT CHALLENGE</b><span>'+t+'</span></div>'})}
function dates(root){[].forEach.call(root.querySelectorAll('.dh'),function(h){if(h.dataset.ok)return;h.dataset.ok=1;var now=h.querySelector('.now');var m=(h.firstChild&&h.firstChild.textContent||'').match(/(\d+)\/(\d+)（([^）]+)）/);if(!m)return;
    var w=m[3].charAt(0),hol=/祝/.test(m[3]),day=h.parentNode;
    if(day){if(w==='土')day.classList.add('sat');if(w==='日')day.classList.add('sun');if(hol)day.classList.add('hol')}
    h.innerHTML='<span class="dn">'+m[2]+'</span><span class="dw">'+w+'</span>'+(hol?'<span class="hol">祝</span>':'');if(now)h.appendChild(now)});
  /* 試合の結果（WIN 57-51）を、新しい見た目のしるしにする */
  [].forEach.call(root.querySelectorAll('summary b[style]'),function(b){var t=b.textContent.trim(),win=/^WIN/.test(t);b.removeAttribute('style');b.className='result '+(win?'win':'lose');b.textContent=t})}
function reveal(root){dates(root);tiles(root);var els=root.querySelectorAll('.day,.tp-hero,.tp-goal,.tp-r,.tp-rw,.tp-teaser,.pre,.mt-wrap,.lk2 a'),n=0;
  [].forEach.call(els,function(el){el.classList.add('rv');var r=el.getBoundingClientRect();
    if(r.top<innerHeight){el.style.transitionDelay=Math.min(n++*70,560)+'ms';requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('in')})});setTimeout(function(){el.style.transitionDelay=''},1200)}
    else if(io)io.observe(el);else el.classList.add('in')})}
function tabs(){var h='<span class="pill" id="pill"></span>'+D.months.map(function(x){return '<button data-k="'+x.key+'"><b>'+MON[x.m-1]+'</b><small>'+x.m+'月</small></button>'}).join('');$('tabs').innerHTML=h;
  [].forEach.call($('tabs').querySelectorAll('button'),function(b){b.onclick=function(){go(b.dataset.k)}});
  var u=D.url||'';$('sub2').innerHTML='<button class="nv" id="tp3"><i>›</i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3.2 3 3.2 9.8 0 12.8M18.4 5.6c-3.2 3-3.2 9.8 0 12.8"/></svg><span><b>3POINT</b><small>3Pシュート記録</small></span></button><a class="nv" href="roster.html"><i>›</i><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.5.1 4.3 1.6 4.8 4.3"/></svg><span><b>ROSTER</b><small>選手名簿</small></span></a><a class="nv" href="album.html"><i>›</i><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.6"/></svg><span><b>ALBUM</b><small>チームアルバム</small></span></a>';
  $('tp3').onclick=function(){go('3p')};$('links').innerHTML=D.links||'';reveal($('links'))}
function pill(){var on=$('tabs').querySelector('button.on'),p=$('pill');if(!p)return;if(!on){p.style.opacity=0;return}
  p.style.opacity=1;p.style.width=on.offsetWidth+'px';p.style.transform='translateX('+on.offsetLeft+'px)'}
function go(k,first){CUR=k;[].forEach.call($('tabs').querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===k)});
  $('tp3')&&$('tp3').classList.toggle('on',k==='3p');pill();
  var mo=D.months.filter(function(x){return x.key===k})[0];
  $('sub').textContent=k==='3p'?'3Pシュート チャレンジ':(mo?'Jr.CLUB市原　'+mo.y+'年'+mo.m+'月':'Jr.CLUB市原 予定表');
  var html=k==='3p'?D.tp:(mo?mo.main:'');
  var v=$('view');v.classList.add('out');
  setTimeout(function(){v.innerHTML=html;[].forEach.call(v.querySelectorAll('script'),function(o){var n=document.createElement('script');n.textContent=o.textContent;o.parentNode.replaceChild(n,o)});applyView();v.classList.remove('out');reveal(v);
    nextGame(k);
    var td=document.getElementById('today');if(first&&td&&td.offsetParent)setTimeout(function(){td.scrollIntoView({block:'center',behavior:'smooth'})},500);
    else if(!first)window.scrollTo({top:0,behavior:'smooth'})},first?0:180)}
/* 次の試合：今月の、今日から先でいちばん近い試合（押すとその日の詳しいところへ） */
function nextGame(k){var box=$('next');box.innerHTML='';if(!D||k!==D.cur)return;
  var days=[].slice.call($('view').querySelectorAll('#vCard .day:not(.past), .day:not(.past)')),hit=null;
  for(var i=0;i<days.length&&!hit;i++){var ev=days[i].querySelector('summary .ev');if(ev&&!/^応援$/.test(ev.textContent.trim()))hit={day:days[i],ev:ev}}
  if(!hit)return;var mo=D.months.filter(function(x){return x.key===k})[0],dn=+(hit.day.querySelector('.dh .dn')||{}).textContent;if(!mo||!dn)return;
  var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),d=new Date(mo.y,mo.m-1,dn),left=Math.round((d-t0)/864e5);
  var sm=hit.ev.parentNode.querySelector('small'),dt=hit.ev.closest('details').querySelector('.dt'),place='';
  if(dt){[].forEach.call(dt.querySelectorAll('.kv'),function(kv){var b=kv.querySelector('b');if(b&&b.textContent.trim()==='場所'){var sp=kv.querySelector('span');place=sp?sp.firstChild&&sp.firstChild.textContent||'':''}})}
  var wd=(hit.day.querySelector('.dh .dw')||{}).textContent||'';
  box.innerHTML='<button class="next" id="nextBtn" aria-label="次の試合を見る"><div class="lb">NEXT GAME</div><h3></h3><p></p><div class="cd'+(left<=0?' today':'')+'">'+(left<=0?'<b>今日</b>':'<span>あと</span><b>'+left+'</b><span>日</span>')+'</div></button>';
  box.querySelector('h3').textContent=hit.ev.textContent.trim();
  box.querySelector('p').innerHTML=mo.m+'/'+dn+'('+wd+') '+(sm?sm.textContent:'')+(place?'<br>'+place.replace(/[<>&]/g,''):'');
  $('nextBtn').onclick=function(){var det=hit.ev.closest('details');if(VIEW==='table'){VIEW='card';applyView()}if(det)det.open=true;hit.day.scrollIntoView({block:'center',behavior:TEAM.calm?'auto':'smooth'})}}
function applyView(){var c=$('vCard'),tb=$('vTable');if(!c||!tb)return;var tbl=VIEW==='table';c.style.display=tbl?'none':'';tb.style.display=tbl?'':'none';
  [].forEach.call(document.querySelectorAll('[data-vw]'),function(x){x.classList.toggle('on',x.dataset.vw===VIEW)});if(tbl)reveal(tb)}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-vw]');if(a){e.preventDefault();VIEW=a.dataset.vw;applyView();return}
  var tp=e.target.closest('a.tp-teaser');if(tp){e.preventDefault();go('3p');return}
  var ln=e.target.closest('a[href]');if(ln&&/[?&]mode=schedule/.test(ln.href)){e.preventDefault();var m=ln.href.match(/[?&]m=([^&]+)/);if(m)go(decodeURIComponent(m[1]));}});
addEventListener('resize',pill);
function show(d,first){D=d;$('apiCss').textContent=d.css||'';tabs();
  if(!CUR){try{var qm=new URLSearchParams(location.search).get('m');if(qm)CUR=qm}catch(e){}}
  var k=(CUR&&(CUR==='3p'||d.months.some(function(x){return x.key===CUR})))?CUR:(d.months.some(function(x){return x.key===d.cur})?d.cur:d.months[0].key);
  go(k,first);$('upd').textContent='最終更新 '+d.at}
/* 開いたときのロゴの動き：その日はじめては長いほう、同じ日の2回目からは短いほう、同じ訪問の中ではもう出さない（ほかのページと共通） */
(function(){var seen=null,day=new Date().toDateString(),how='';try{seen=sessionStorage.getItem('jr_intro');sessionStorage.setItem('jr_intro','1')}catch(e){}
  if(!seen){var last='';try{last=localStorage.getItem('jr_intro_day')||'';localStorage.setItem('jr_intro_day',day)}catch(e){}how=last===day?'short':'full'}
  TEAM.intro($('logo'),how)})();
var cache=load();if(cache&&cache.months){show(cache,true)}
function fetchNew(n){fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(!d||!d.ok)throw 0;
    var changed=!cache||JSON.stringify(cache.months)!==JSON.stringify(d.months)||cache.tp!==d.tp;save(d);
    if(!cache)show(d,true);else if(changed){var y=scrollY;show(d,false);setTimeout(function(){scrollTo(0,y)},250)}else $('upd').textContent='最終更新 '+d.at;cache=d})
  .catch(function(){if(n<1)return setTimeout(function(){fetchNew(n+1)},1500);if(!cache)$('view').innerHTML='<div class="err">予定を読み込めませんでした。電波の良いところで開き直してください。</div>'})}
fetchNew(0);
})();
</script>
<script src="club-page.js?v=2"></script>
</body>
</html>
